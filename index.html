<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alex Schenk — strategy and design." />
    <title>Alex Schenk — Strategy &amp; Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero-scroll" id="hero-scroll">
      <section class="stage" id="stage" aria-label="Alex Schenk portfolio introduction">
        <svg class="filters" aria-hidden="true" focusable="false">
          <filter id="subtext-distortion" x="-20%" y="-60%" width="140%" height="220%">
            <feTurbulence type="turbulence" baseFrequency="0.012 0.08" numOctaves="2" seed="8" result="noise" />
            <feDisplacementMap id="subtext-displacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <filter id="subtext-print" x="-4%" y="-12%" width="108%" height="124%">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="13" result="grain" />
            <feDisplacementMap in="SourceGraphic" in2="grain" scale="0.35" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <filter id="reel-motion-blur" x="-30%" y="-80%" width="160%" height="260%">
            <feGaussianBlur id="reel-blur" stdDeviation="0 0" />
          </filter>
        </svg>
        <p class="scroll-cue" aria-hidden="true">scroll</p>
        <div class="title-group">
          <h1 id="name" aria-label="Alex Schenk">
            <span aria-hidden="true">A</span><span aria-hidden="true">l</span><span aria-hidden="true">e</span><span aria-hidden="true">x</span><span class="space" aria-hidden="true"> </span><span aria-hidden="true">S</span><span aria-hidden="true">c</span><span aria-hidden="true">h</span><span aria-hidden="true">e</span><span aria-hidden="true">n</span><span aria-hidden="true">k</span>
          </h1>
          <span id="line-entrance">
            <button id="rotating-line" type="button" aria-label="listens a lot. Activate to change the word.">
              <span id="word-slot" aria-hidden="true"><span id="word-drum"></span></span><span class="lot" aria-hidden="true">a lot</span>
            </button>
          </span>
          <span id="word-measure" aria-hidden="true"></span>
        </div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
